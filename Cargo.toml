[package]
name = "connex-rs"
version = "0.1.2"
edition = "2021"
description = "Connex data plane over UCX: one-sided RMA on host/GPU memory, identity-keyed peers, peer-failure events, same-identity rejoin"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/HeterInfra/connex-rs"
keywords = ["ucx", "rdma", "gpudirect", "llm-serving", "transport"]
categories = ["network-programming", "api-bindings"]
links = "ucp"
exclude = ["/results", "/target*", "/dist", "/.github", "/scripts", "/docs/assets/social"]

[lib]
name = "connex_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
libc = "0.2"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }

[build-dependencies]
cc = "1"

[profile.release]
debug = 1

[lints.clippy]
# FFI-shaped signatures mirror the UCX calls they wrap.
too_many_arguments = "allow"
single_match = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
