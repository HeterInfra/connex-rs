<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="connex-rs design">
  <title>connex-rs: progress thread, identity-keyed peers, failure events</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; }
    .pt { fill: #ecfdf5; stroke: #0d9488; stroke-width: 2; }
    .row { fill: #ffffff; stroke: #0d9488; stroke-width: 1; }
    .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.3; }
    .t { font-size: 14px; font-weight: 600; } .s { font-size: 12px; fill: #475569; }
    .m { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .arr { stroke: #2563eb; stroke-width: 2; fill: none; } .ah { fill: #2563eb; }
    .ev { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 6 4; } .eh { fill: #dc2626; }
    .lbl { font-size: 12px; fill: #1e3a8a; } .elbl { font-size: 12px; fill: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; } .bg { fill: #0d1117; } .box { fill: #161b22; stroke: #484f58; }
      .pt { fill: #062b26; stroke: #2dd4bf; } .row { fill: #0d1117; stroke: #2dd4bf; }
      .bad { fill: #2d1214; stroke: #f87171; } .s { fill: #9ca3af; } .m { fill: #e6edf3; }
      .arr { stroke: #58a6ff; } .ah { fill: #58a6ff; } .lbl { fill: #93c5fd; }
      .ev { stroke: #f87171; } .eh { fill: #f87171; } .elbl { fill: #fca5a5; }
    }
  </style>
  <rect class="bg" width="880" height="360"/>

  <rect class="box" x="16" y="40" width="210" height="280" rx="10"/>
  <text class="t" x="32" y="66">Caller (connex.pp)</text>
  <text class="s" x="32" y="86">Python, GIL released</text>
  <text class="s" x="32" y="102">while waiting</text>
  <text class="m" x="32" y="136">register_memory()</text>
  <text class="m" x="32" y="156">transfer_sync_read()</text>
  <text class="m" x="32" y="176">put_signal()</text>
  <text class="m" x="32" y="196">send_msg() / recv_msg()</text>
  <text class="m" x="32" y="250">wait_event()</text>
  <text class="s" x="32" y="270">up | joined | failed</text>

  <rect class="pt" x="300" y="40" width="300" height="280" rx="10"/>
  <text class="t" x="316" y="66">Progress thread</text>
  <text class="s" x="316" y="86">owns the UCX worker; heartbeat 1 s / 3 s,</text>
  <text class="s" x="316" y="102">per-op timeouts, rkey cache</text>
  <text class="t" x="316" y="136">Peers keyed by logical id</text>
  <rect class="row" x="316" y="148" width="268" height="30" rx="5"/>
  <text class="m" x="326" y="168">ip:port#llama-8b|1|0|0</text>
  <rect class="row" x="316" y="184" width="268" height="30" rx="5"/>
  <text class="m" x="326" y="204">ip:port#llama-8b|2|0|0</text>
  <rect class="bad" x="316" y="220" width="268" height="30" rx="5"/>
  <text class="m" x="326" y="240">ip:port#llama-8b|3|0|0  failed</text>
  <text class="s" x="316" y="276">restart under the same id: the entry</text>
  <text class="s" x="316" y="292">is replaced, peers see "joined"</text>

  <rect class="box" x="674" y="40" width="190" height="280" rx="10"/>
  <text class="t" x="690" y="66">UCX</text>
  <text class="s" x="690" y="86">RDMA (verbs, rdmacm)</text>
  <text class="s" x="690" y="102">GPUDirect, or TCP</text>
  <text class="s" x="690" y="136">one-sided get / put</text>
  <text class="s" x="690" y="156">active messages</text>
  <text class="s" x="690" y="190">endpoint error when</text>
  <text class="s" x="690" y="206">the peer's kernel tears</text>
  <text class="s" x="690" y="222">the connection down</text>

  <path class="arr" d="M226 150 H 292"/><polygon class="ah" points="300,150 288,144 288,156"/>
  <text class="lbl" x="232" y="140">commands</text>
  <path class="arr" d="M600 150 H 666"/><polygon class="ah" points="674,150 662,144 662,156"/>
  <path class="ev" d="M674 214 H 608"/><polygon class="eh" points="600,214 612,208 612,220"/>
  <text class="elbl" x="610" y="236">ms</text>
  <path class="ev" d="M300 250 H 234"/><polygon class="eh" points="226,250 238,244 238,256"/>
  <text class="elbl" x="234" y="240">events</text>
</svg>
